name: Keep Render Services Alive

on:
  schedule:
    # Run every 10 minutes during active hours (to stay within free tier limits)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-services:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend API Health Endpoint
        run: |
          echo "🔄 Pinging backend API health endpoint..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://brain-tumor-api-yrxf.onrender.com/health || echo "000")
          echo "Backend response code: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Backend is alive and healthy"
          else
            echo "⚠️ Backend returned status: $response (may be spinning up)"
          fi
          
      - name: Ping Frontend Application
        run: |
          echo "🔄 Pinging frontend application..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://brain-tumor-detection-ai.onrender.com/ || echo "000")
          echo "Frontend response code: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Frontend is alive and serving"
          else
            echo "⚠️ Frontend returned status: $response (may be spinning up)"
          fi
          
      - name: Wait for Services to Warm Up
        if: always()
        run: |
          echo "⏳ Waiting 30 seconds for services to warm up..."
          sleep 30
          
      - name: Verify Backend API
        run: |
          echo "🔍 Verifying backend API with second check..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://brain-tumor-api-yrxf.onrender.com/health || echo "000")
          echo "Backend verification: $response"
          
      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✨ Keep-alive ping completed at $(date)"
          echo "🎯 Services have been pinged to prevent spin-down"
          echo "📊 This workflow runs every 10 minutes"
          echo "💡 Render free tier: 750 hours/month per service"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
