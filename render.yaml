services:
  # Backend API Service (FREE TIER)
  - type: web
    name: brain-tumor-api
    env: python
    plan: free  # FREE tier - $0/month (spins down after 15 min inactivity)
    region: oregon
    branch: main
    buildCommand: "cd backend && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd backend && python main.py"
    envVars:
      - key: APP_NAME
        value: Brain Tumor Detection API
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "False"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODEL_PATH
        value: ../model/final_brain_tumor_model_97.keras
      - key: MODEL_INPUT_SIZE
        value: "224"
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: TRAINING_HISTORY_PATH
        value: ../model_training_phase/training_history.csv
      - key: TRAINING_HISTORY_2_PATH
        value: ../model_training_phase/training_history_2.csv
      - key: MODEL_PREDICTIONS_PATH
        value: ../model_training_phase/model_predictions.csv
      - key: TEST_IMAGES_PATH
        value: ../image
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health


